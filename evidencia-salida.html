<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Subir evidencia · Tecnocontrol</title>
<style>
  :root{ --azul:#1473E6; --teal:#0e7490; --teal2:#0891b2; --ink:#0f172a; --mute:#64748b; --line:#e6ebf2; --bg:#eef2f7; --ok:#12A150; --rojo:#E23B3B; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);padding-bottom:40px;}
  .hero{background:linear-gradient(135deg,#0a0f1e,#13246B);padding:22px 18px 30px;text-align:center;}
  .hero-logo{height:44px;}
  .hero h1{color:#fff;font-size:17px;margin:10px 0 2px;}
  .hero p{color:#c7d2fe;font-size:12px;margin:0;}
  .wrap{max-width:480px;margin:-16px auto 0;padding:0 14px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px rgba(16,24,40,.05);}
  .info-row{font-size:13px;color:#334155;padding:3px 0;}
  .info-row b{color:var(--ink);}
  label{font-size:12px;font-weight:700;color:var(--mute);display:block;margin-bottom:4px;}
  input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px;box-sizing:border-box;}
  .upload-btn{display:block;width:100%;text-align:center;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border:none;border-radius:14px;padding:18px;font-size:16px;font-weight:800;cursor:pointer;}
  .upload-btn:disabled{opacity:.6;}
  .grid-evid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
  .grid-evid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer;}
  .evid-item .meta{font-size:9px;color:var(--mute);text-align:center;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .msg{text-align:center;font-size:12.5px;font-weight:700;margin-top:10px;min-height:18px;}
  .loading{text-align:center;color:var(--mute);font-size:13px;padding:20px;}
</style>
</head>

  <h1>Evidencia de salida de material</h1>
  <p id="hero-sub">Cargando pedido…</p>
</div>
<div class="wrap">
  <div class="card" id="info-card">
    <div class="loading">Cargando información del pedido…</div>
  </div>
  <div class="card">
    <label>Tu nombre (quién sube la evidencia) *</label>
    <input type="text" id="f-nombre" placeholder="Ej. Ricardo Torres" autocomplete="off">
    <input type="file" accept="image/*,.pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" id="f-file" style="display:none">
    <button class="upload-btn" id="btn-subir" type="button">📷 Tomar foto / subir documento</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="card">
    <label style="margin-bottom:10px;">Evidencia subida (<span id="cont-count">0</span>)</label>
    <div class="grid-evid" id="grid-evid"><div class="loading" style="grid-column:1/-1;">—</div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const config = { apiKey:"AIzaSyBXh-P0oMtMiDjyz9PObuJ8DNfROlXvhLE", authDomain:"tecnocontrol-1c42f.firebaseapp.com", projectId:"tecnocontrol-1c42f", storageBucket:"tecnocontrol-1c42f.firebasestorage.app", appId:"1:27642771956:web:54225af9e386afded8a1a1" };
const app = initializeApp(config, 'kiosco-evidencia');
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

/* Auth anónima (requerida por las reglas de Firestore) — mismo patrón que solicitud-material.html */
let authReadyResolve;
const authReady = new Promise(res => { authReadyResolve = res; });
onAuthStateChanged(auth, user => { if (user) authReadyResolve(); });
signInAnonymously(auth).catch(err => console.error('[evidencia auth] signInAnonymously:', err));

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const params = new URLSearchParams(window.location.search);
const pedidoId = params.get('id');

if(!pedidoId){
  $('info-card').innerHTML = '<div class="loading" style="color:var(--rojo);">Falta el identificador del pedido en el enlace. Pide un nuevo enlace/QR desde Almacén.</div>';
  $('hero-sub').textContent = 'Enlace incompleto';
} else {
  authReady.then(()=> getDoc(doc(db,'surtidos',pedidoId))).then(snap=>{
    if(!snap.exists()){
      $('info-card').innerHTML = '<div class="loading" style="color:var(--rojo);">No se encontró el pedido. Pide un nuevo enlace desde Almacén.</div>';
      $('hero-sub').textContent = 'Pedido no encontrado';
      return;
    }
    const d = snap.data()||{};
    $('hero-sub').textContent = 'Folio ' + (d.folio||'—');
    $('info-card').innerHTML = ''
      + '<div class="info-row"><b>Folio:</b> '+esc(d.folio||'—')+'</div>'
      + '<div class="info-row"><b>Cliente / destino:</b> '+esc(d.cliente||d.destino||'—')+'</div>'
      + '<div class="info-row"><b>Tipo:</b> '+(d.tipo==='material'?'Material':'Venta')+'</div>'
      + '<div class="info-row"><b>Solicitó:</b> '+esc(d.solicitante||d.vendedor||'—')+'</div>';
  }).catch(e=>{
    console.error('[evidencia] error al cargar el pedido:', e);
    $('info-card').innerHTML = '<div class="loading" style="color:var(--rojo);">No se pudo cargar el pedido (revisa tu conexión, o pide un nuevo enlace).</div>';
  });

  /* Nombre recordado localmente para no volver a escribirlo cada vez que se usa el mismo celular */
  try{ const guardado = localStorage.getItem('evid_nombre_almacen'); if(guardado) $('f-nombre').value = guardado; }catch(e){}

  function comprimirImagen(file){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = e=>{
        const img = new Image();
        img.onload = ()=>{
          const maxW = 480;
          const scale = Math.min(1, maxW/img.width);
          const w = Math.max(1,Math.round(img.width*scale)), h = Math.max(1,Math.round(img.height*scale));
          const c = document.createElement('canvas'); c.width=w; c.height=h;
          const cx = c.getContext('2d');
          cx.fillStyle='#ffffff'; cx.fillRect(0,0,w,h);
          cx.drawImage(img,0,0,w,h);
          resolve(c.toDataURL('image/jpeg',0.72));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function setMsg(t,c){ $('msg').textContent = t||''; $('msg').style.color = c||'var(--rojo)'; }

  $('btn-subir').onclick = ()=>{
    const nombre = $('f-nombre').value.trim();
    if(!nombre){ setMsg('Escribe tu nombre antes de subir la foto.'); return; }
    try{ localStorage.setItem('evid_nombre_almacen', nombre); }catch(e){}
    $('f-file').click();
  };

  $('f-file').onchange = async ()=>{
    const file = $('f-file').files && $('f-file').files[0];
    $('f-file').value = '';
    if(!file) return;
    const nombre = $('f-nombre').value.trim();
    setMsg('Subiendo…','var(--teal)');
    $('btn-subir').disabled = true;
    try{
      await authReady;
      if(file.type && file.type.startsWith('image/')){
        // Foto: se comprime y se guarda incrustada en el propio documento — igual que siempre.
        const dataUrl = await comprimirImagen(file);
        await addDoc(collection(db,'surtidos',pedidoId,'evidencias'), {
          tipo:'imagen', imagen: dataUrl, subidoPor: nombre, subidoPorEmail: null, subidoEn: serverTimestamp()
        });
      } else {
        // Documento (PDF/Word/etc.): va a Firebase Storage, y en Firestore solo se guarda la
        // referencia — un documento normal no cabe en un documento de Firestore (límite 1MB).
        const ruta = 'evidencias/' + pedidoId + '/' + Date.now() + '_' + file.name;
        const sref = storageRef(storage, ruta);
        await uploadBytes(sref, file);
        const url = await getDownloadURL(sref);
        await addDoc(collection(db,'surtidos',pedidoId,'evidencias'), {
          tipo:'archivo', nombre: file.name, url, mimeType: file.type || null,
          subidoPor: nombre, subidoPorEmail: null, subidoEn: serverTimestamp()
        });
      }
      setMsg('✓ Subido','var(--ok)');
    }catch(e){
      console.error('[evidencia] error al subir:', e);
      setMsg('No se pudo subir ('+(e.code||e.message||'error')+'). Si el error es de permisos, revisa las reglas de Firestore/Storage para permitir escritura anónima.');
    }finally{
      $('btn-subir').disabled = false;
    }
  };

  /* Vista en vivo de las evidencias ya subidas — mismo esquema que usa el portal de escritorio,
     así Almacén ve en la app principal las fotos subidas desde el celular sin recargar nada. */
  authReady.then(()=>{
    onSnapshot(query(collection(db,'surtidos',pedidoId,'evidencias'), orderBy('subidoEn','asc')), snap=>{
      const items = [];
      snap.forEach(d=> items.push(Object.assign({id:d.id}, d.data())));
      $('cont-count').textContent = items.length;
      $('grid-evid').innerHTML = items.length ? items.map(it=>{
        if(it.imagen){
          return '<div class="evid-item"><img src="'+esc(it.imagen)+'" onclick="window.open(this.src, \'_blank\')"><div class="meta">'+esc(it.subidoPor||'—')+'</div></div>';
        }
        return '<div class="evid-item"><a href="'+esc(it.url||'#')+'" target="_blank" style="display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1;background:#f8fafc;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:inherit;"><span style="font-size:32px;">📄</span><span style="font-size:11px;text-align:center;padding:0 4px;word-break:break-word;">'+esc(it.nombre||'Documento')+'</span></a><div class="meta">'+esc(it.subidoPor||'—')+'</div></div>';
      }).join('') : '<div class="loading" style="grid-column:1/-1;">Aún no hay evidencia subida.</div>';
    }, e=>{ console.warn('[evidencia] no se pudo escuchar evidencias:', e.message); });
  });
}
</script>
</body>
</html>
