<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Directorio · Revisión nombre/correo/departamento</title>
<style>
  body{font-family:-apple-system,'Segoe UI',sans-serif;background:#f8fafc;margin:0;padding:24px;color:#0f172a}
  h1{font-size:18px;margin:0 0 4px}
  .sub{font-size:12.5px;color:#64748b;margin-bottom:18px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  th{background:#0A1628;color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.3px;padding:9px 10px;text-align:left}
  td{padding:7px 10px;border-bottom:1px solid #f1f5f9;font-size:13px;vertical-align:middle}
  input[type=text]{width:100%;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:12.5px;box-sizing:border-box}
  select{width:100%;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:12.5px}
  .fuentes span{display:inline-block;background:#f1f5f9;color:#475569;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;margin-right:3px}
  .fuentes span.falta{background:#fef2f2;color:#b91c1c}
  button.guardar{padding:6px 12px;background:#0A1628;color:#fff;border:none;border-radius:7px;font-size:11.5px;font-weight:700;cursor:pointer}
  button.guardar:disabled{opacity:.5;cursor:default}
  .estado{font-size:10.5px;margin-top:3px}
  .estado.ok{color:#15803d}
  .estado.err{color:#b91c1c}
  #filtro{width:320px;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;margin-bottom:14px}
  #resumen{font-size:12px;color:#64748b;margin-bottom:10px}
</style>
</head>
<body>

<h1>Directorio — Revisión de nombre / correo / departamento</h1>
<div class="sub">Junta <b>usuarios</b>, <b>colaboradores</b> y <b>fl_usuarios</b>. Corrige y da clic en Guardar por fila — actualiza <b>usuarios</b> y <b>colaboradores</b> a la vez (las dos fuentes que usa el portal para mostrar nombres).</div>

<input id="filtro" type="text" placeholder="Buscar por correo o nombre…">
<div id="resumen">Cargando…</div>
<table>
  <thead><tr><th style="width:22%">Correo</th><th style="width:22%">Nombre</th><th style="width:18%">Departamento</th><th style="width:14%">Aparece en</th><th style="width:10%">Activo</th><th style="width:14%"></th></tr></thead>
  <tbody id="tbody"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, setDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const config = { apiKey:"AIzaSyBXh-P0oMtMiDjyz9PObuJ8DNfROlXvhLE", authDomain:"tecnocontrol-1c42f.firebaseapp.com", projectId:"tecnocontrol-1c42f", storageBucket:"tecnocontrol-1c42f.firebasestorage.app", appId:"1:27642771956:web:54225af9e386afded8a1a1" };
const app = initializeApp(config, 'admin-directorio');
const db = getFirestore(app);
const auth = getAuth(app);

const DEPARTAMENTOS = ['Ingresos','Egresos','Contabilidad','Administración','Recursos Humanos','Marketing','Ventas','Pagos','Gestoría','Almacén','Compras','Operaciones','Flotilla','Contraloría'];
const $ = id => document.getElementById(id);

// Requiere sesión real del portal (mismas cuentas de siempre) — esta
// herramienta no crea acceso nuevo, solo lee/edita lo que tu cuenta ya
// puede leer/editar según las reglas de Firestore.
onAuthStateChanged(auth, user=>{
  if(user){
    document.getElementById('login-overlay')?.remove();
    cargarTodo();
  } else {
    if(document.getElementById('login-overlay')) return;
    const ov = document.createElement('div');
    ov.id = 'login-overlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:99999;display:flex;align-items:center;justify-content:center';
    ov.innerHTML = '<div style="max-width:360px;width:100%;background:#fff;padding:24px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)">'+
      '<h2 style="font-size:15px;margin:0 0 14px">Inicia sesión</h2>'+
      '<input id="li-mail" placeholder="Correo" style="width:100%;padding:9px;margin-bottom:8px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box">'+
      '<input id="li-pass" type="password" placeholder="Contraseña" style="width:100%;padding:9px;margin-bottom:10px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box">'+
      '<button id="li-btn" style="width:100%;padding:10px;background:#0A1628;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer">Entrar</button>'+
      '<div id="li-err" style="color:#b91c1c;font-size:12px;margin-top:8px"></div></div>';
    document.body.appendChild(ov);
    document.getElementById('li-btn').onclick = async ()=>{
      try{ await signInWithEmailAndPassword(auth, document.getElementById('li-mail').value.trim(), document.getElementById('li-pass').value); }
      catch(e){ document.getElementById('li-err').textContent = 'No se pudo entrar: '+(e.code||e.message); }
    };
  }
});

let registro = {}; // correo → {nombre, departamento, activo, fuentes:Set, uidUsuarios, idColaborador}

async function cargarTodo(){
  $('resumen').textContent = 'Cargando usuarios, colaboradores y fl_usuarios…';
  const [snapUsuarios, snapColab, snapFl] = await Promise.all([
    getDocs(collection(db,'usuarios')).catch(()=>({forEach:()=>{}})),
    getDocs(collection(db,'colaboradores')).catch(()=>({forEach:()=>{}})),
    getDocs(collection(db,'fl_usuarios')).catch(()=>({forEach:()=>{}})),
  ]);

  function clave(correo){ return (correo||'').toLowerCase().trim(); }
  function asegurar(correo){
    const k = clave(correo);
    if(!k) return null;
    if(!registro[k]) registro[k] = {correo:k, nombre:'', departamento:'', activo:true, fuentes:new Set()};
    return registro[k];
  }

  snapUsuarios.forEach(d=>{
    const u=d.data(); const r=asegurar(u.correo); if(!r) return;
    r.fuentes.add('usuarios'); r.uidUsuarios=d.id;
    if(u.nombre) r.nombre=u.nombre;
    if(u.departamento) r.departamento=u.departamento;
    if(u.activo===false) r.activo=false;
  });
  snapColab.forEach(d=>{
    const c=d.data(); const correo=c.correo||d.id; const r=asegurar(correo); if(!r) return;
    r.fuentes.add('colaboradores'); r.idColaborador=d.id;
    if(!r.nombre && c.nombre) r.nombre=c.nombre;
    if(!r.departamento && c.departamento) r.departamento=c.departamento;
  });
  snapFl.forEach(d=>{
    const f=d.data(); const r=asegurar(f.email||f.correo); if(!r) return;
    r.fuentes.add('fl_usuarios');
    if(!r.nombre && f.nombre) r.nombre=f.nombre;
  });

  render();
}

function render(filtro){
  const tbody = $('tbody');
  const q=(filtro||'').toLowerCase().trim();
  const filas = Object.values(registro)
    .filter(r=> !q || r.correo.includes(q) || (r.nombre||'').toLowerCase().includes(q))
    .sort((a,b)=> (a.nombre||a.correo).localeCompare(b.nombre||b.correo));
  $('resumen').textContent = filas.length+' correos encontrados. Los que faltan en alguna colección aparecen marcados en rojo — eso es lo que causa que se muestre el correo en vez del nombre en algunas partes del portal.';
  tbody.innerHTML = filas.map(r=>{
    const idRow = 'row-'+btoa(r.correo).replace(/[^a-zA-Z0-9]/g,'');
    const faltaUsuarios = !r.fuentes.has('usuarios');
    const faltaColab = !r.fuentes.has('colaboradores');
    return '<tr id="'+idRow+'">'+
      '<td>'+r.correo+'</td>'+
      '<td><input type="text" class="in-nombre" value="'+esc(r.nombre)+'" placeholder="Nombre completo"></td>'+
      '<td><select class="in-depto"><option value="">—</option>'+DEPARTAMENTOS.map(d=>'<option value="'+d+'" '+(r.departamento===d?'selected':'')+'>'+d+'</option>').join('')+'</select></td>'+
      '<td class="fuentes">'+
        '<span class="'+(faltaUsuarios?'falta':'')+'">usuarios</span>'+
        '<span class="'+(faltaColab?'falta':'')+'">colaboradores</span>'+
        (r.fuentes.has('fl_usuarios')?'<span>fl_usuarios</span>':'')+
      '</td>'+
      '<td><input type="checkbox" class="in-activo" '+(r.activo?'checked':'')+'></td>'+
      '<td><button class="guardar" onclick="window.__guardarFila(\''+r.correo+'\',\''+idRow+'\')">Guardar</button><div class="estado" id="'+idRow+'-msg"></div></td>'+
      '</tr>';
  }).join('');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

$('filtro').oninput = ()=> render($('filtro').value);

window.__guardarFila = async function(correo, idRow){
  const tr = document.getElementById(idRow);
  const nombre = tr.querySelector('.in-nombre').value.trim();
  const departamento = tr.querySelector('.in-depto').value;
  const activo = tr.querySelector('.in-activo').checked;
  const btn = tr.querySelector('button.guardar');
  const msgEl = document.getElementById(idRow+'-msg');
  if(!nombre){ msgEl.textContent='Escribe el nombre.'; msgEl.className='estado err'; return; }
  btn.disabled = true; msgEl.textContent='Guardando…'; msgEl.className='estado';
  const r = registro[correo];
  try{
    // 1) usuarios — doc por UID; si no existe, buscar por campo correo antes
    //    de crear uno nuevo (para no duplicar el registro real del login).
    let uid = r.uidUsuarios;
    if(!uid){
      const snap = await getDocs(query(collection(db,'usuarios'), where('correo','==',correo)));
      if(!snap.empty) uid = snap.docs[0].id;
    }
    if(uid){
      await updateDoc(doc(db,'usuarios',uid), {nombre, departamento, activo});
    }else{
      msgEl.textContent='Guardado en colaboradores. Sin cuenta en "usuarios" todavía — créala desde Administración de usuarios.';
    }
    // 2) colaboradores — mismo criterio: actualizar si existe, crear si no.
    let idColab = r.idColaborador;
    if(!idColab){
      const snap2 = await getDocs(query(collection(db,'colaboradores'), where('correo','==',correo)));
      idColab = snap2.empty ? correo : snap2.docs[0].id; // si no existe, usa el correo como id (mismo patrón que ya usa el portal)
    }
    await setDoc(doc(db,'colaboradores',idColab), {correo, nombre, departamento}, {merge:true});

    r.nombre=nombre; r.departamento=departamento; r.activo=activo; r.uidUsuarios=uid; r.idColaborador=idColab;
    r.fuentes.add('colaboradores'); if(uid) r.fuentes.add('usuarios');
    msgEl.textContent = uid ? 'Guardado en usuarios y colaboradores ✓' : msgEl.textContent;
    msgEl.className='estado ok';
    render($('filtro').value);
  }catch(e){
    msgEl.textContent = 'Error: '+(e.code||e.message);
    msgEl.className='estado err';
  }finally{ btn.disabled=false; }
};
</script>
</body>
</html>
