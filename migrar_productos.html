const CAMPOS = ["codigo","nombre","tipo","lista1","lista2","lista3","lista4","lista5","lista6","lista7"];

const log = document.getElementById('log');
const addLog = (msg, color='#a3e635') => {
  log.innerHTML += `<span style="color:${color}">${msg}</span>\n`;
  log.scrollTop = log.scrollHeight;
};

// Limpiar código para usar como ID en Firestore (sin diagonales)
const safeId = (codigo) => String(codigo).replace(/\//g, '_').replace(/\.\./g, '_').trim() || 'SIN_CODIGO';

window.limpiarColeccion = async () => {
  if(!confirm('¿Eliminar todos los productos de Firestore?')) return;
  addLog('🗑 Limpiando...', '#fbbf24');
  const snap = await getDocs(collection(db, 'productos_catalogo'));
  const batch = writeBatch(db);
  snap.docs.forEach(d => batch.delete(d.ref));
  await batch.commit();
  addLog(`✅ ${snap.docs.length} productos eliminados.`);
};

window.iniciarMigracion = async () => {
  const btn = document.getElementById('btn-migrar');
  btn.disabled = true; btn.textContent = 'Migrando...';
  
  let ok = 0, err = 0;
  const total = PRODUCTOS.length;
  const BATCH_SIZE = 400;
  
  addLog(`🚀 Iniciando migración de ${total} productos...`);
  
  for(let i = 0; i < PRODUCTOS.length; i += BATCH_SIZE) {
    const lote = PRODUCTOS.slice(i, i + BATCH_SIZE);
    const batch = writeBatch(db);
    
    lote.forEach(p => {
      const obj = {};
      CAMPOS.forEach((campo, idx) => { obj[campo] = p[idx] ?? null; });
      obj.codigoOriginal = obj.codigo; // guardar código original
      const id = safeId(obj.codigo);
      const ref = doc(db, 'productos_catalogo', id);
      batch.set(ref, obj);
    });
    
    try {
      await batch.commit();
      ok += lote.length;
      const pct = Math.round(ok/total*100);
      addLog(`✅ Lote ${Math.floor(i/BATCH_SIZE)+1}: ${ok}/${total} productos (${pct}%)`);
      document.getElementById('stat-ok').textContent = ok;
      document.getElementById('stat-pct').textContent = pct + '%';
      document.getElementById('progress-bar').style.width = pct + '%';
    } catch(e) {
      err += lote.length;
      addLog(`❌ Error lote ${Math.floor(i/BATCH_SIZE)+1}: ${e.message}`, '#ef4444');
      document.getElementById('stat-err').textContent = err;
    }
  }
  
  if(err === 0){
    addLog(`\n🎉 ¡COMPLETADO! ${ok} productos en Firestore.`);
    addLog('Puedes cerrar esta página.', '#94a3b8');
  } else {
    addLog(`\n⚠️ ${ok} OK, ${err} con error.`, '#fbbf24');
  }
  btn.textContent = '✅ Completado';
};
