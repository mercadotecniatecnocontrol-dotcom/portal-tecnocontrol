<title>Almacén Pedidos · Tecnocontrol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="CSS/pedidos-almacen.css">
<style>
  /* ── Franja de cajas en movimiento: mantiene la pantalla "viva" para que la TV no la trate como estática y no se suspenda ──
     Se decora automáticamente según la fecha (Halloween, Navidad, 16 de Sept.) y cumpleaños registrados, siempre discreta. */
  .tv-marquee{width:100%;overflow:hidden;height:38px;display:flex;align-items:center;background:linear-gradient(90deg,rgba(20,115,226,.06),rgba(20,115,226,.02));border-top:1px solid rgba(148,163,184,.18);position:relative;}
  .tv-marquee::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--tv-theme,#1473E6) 0%,transparent 2.5%,transparent 97.5%,var(--tv-theme,#1473E6) 100%);opacity:.06;pointer-events:none;}
  .tv-marquee-track{display:flex;align-items:center;gap:28px;white-space:nowrap;animation:tvMarqueeScroll 40s linear infinite;will-change:transform;}
  .tvm-box{display:inline-flex;width:17px;height:17px;color:var(--tv-theme,#94a3b8);opacity:.6;flex-shrink:0;transition:opacity .4s;}
  .tvm-box svg{width:100%;height:100%;}
  .tvm-box.bday{opacity:.85;}
  @keyframes tvMarqueeScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  body.dark .tv-marquee{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border-top-color:rgba(255,255,255,.08);}
  /* ── Etiqueta de destino de entrega en las tarjetas de la TV ── */
  .cdest{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;border:1px solid;border-radius:99px;padding:2px 9px;white-space:normal;}
  /* ── Chips de alerta: visibles pero elegantes; laten muy suave solo cuando hay algo que atender ── */
  .chip.alerta-viva .n{animation:chipLatido 1.8s ease-in-out infinite;}
  @keyframes chipLatido{0%,100%{opacity:1;}50%{opacity:.55;}}
  .chip.chip-critico{box-shadow:0 0 0 0 rgba(226,59,59,.35);animation:chipHalo 2.2s ease-in-out infinite;}
  @keyframes chipHalo{0%{box-shadow:0 0 0 0 rgba(226,59,59,.28);}70%{box-shadow:0 0 0 6px rgba(226,59,59,0);}100%{box-shadow:0 0 0 0 rgba(226,59,59,0);}}
  /* ── Temporada activa: pequeña etiqueta discreta junto al reloj, nunca invasiva ── */
  .tv-temporada{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--tv-theme,#64748b);opacity:.85;letter-spacing:.3px;}
  .tv-temporada svg{width:14px;height:14px;}
</style>
</head>

/*  DATOS EN VIVO (poblado por onSnapshot de la colección `surtidos`)  */
let pedidos=[];

/*  COLOR: estado + semáforo de tiempo  */
function effColor(p){
  if(p.estado==='esperando_autorizacion') return {k:'morado',label:'ESPERANDO AUT.'};
  if(p.estado==='entregado') return {k:'gris',label:'ENTREGADO'};
  if(p.estado==='parcial') return {k:'naranja',label:'ENTREGA PARCIAL'};
  const mins=(now()-p.createdAt)/60000, sla=SLA[p.prioridad]||30;
  if(mins>sla) return {k:'rojo',label:'RETRASADO'};
  if(mins>SEMAFORO.naranja) return {k:'naranja',label:'CERCA DEL LÍMITE'};
  if(mins>SEMAFORO.amarillo) return {k:'amarillo',label:'POR VENCER SLA'};
  if(p.estado==='en_preparacion') return {k:'verde',label:'EN PREPARACIÓN'};
  return {k:'azul',label:'NUEVO · PENDIENTE'};
}
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const piezas=p=>(Array.isArray(p.productos)?p.productos:[]).reduce((a,x)=>a+(Number(x.cant)||0),0);
// ── Vencimiento por fecha tentativa de entrega ──
function diasA(fechaStr){
  if(!fechaStr) return null;
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const f=new Date(String(fechaStr).length<=10 ? fechaStr+'T00:00:00' : fechaStr);
  if(isNaN(f)) return null; f.setHours(0,0,0,0);
  return Math.round((f-hoy)/86400000);
}
function venc(p){
  const dd=diasA(p.fechaEntrega); if(dd===null) return null;
  let txt,k;
  if(dd<0){ txt='VENCIÓ hace '+Math.abs(dd)+'d'; k='rojo'; }
  else if(dd===0){ txt='ENTREGA HOY'; k='naranja'; }
  else if(dd<=2){ txt=dd+'d p/ entrega'; k='amarillo'; }
  else { txt=dd+'d p/ entrega'; k='verde'; }
  return { txt, color:COLORS[k] };
}
// ── Estado del carrusel del hero (independiente por panel) ──
const HERO_PER_PAGE=4;
const heroState={ v:{pages:[[]],idx:0,timer:null}, m:{pages:[[]],idx:0,timer:null} };
function startHeroCarousel(tk){
  const st=heroState[tk];
  clearInterval(st.timer); st.timer=null;
  if(st.pages.length<=1) return;
  st.timer=setInterval(()=>{
    const view=document.querySelector('#'+tk+'Hero .hpick-view');
    if(!view){ clearInterval(st.timer); st.timer=null; return; }
    const pages=view.querySelectorAll('.hpick-page'); if(pages.length<2) return;
    if(pages[st.idx]) pages[st.idx].classList.remove('on');
    st.idx=(st.idx+1)%pages.length;
    if(pages[st.idx]) pages[st.idx].classList.add('on');
    document.querySelectorAll('#'+tk+'Hero .hpick-dots .hd').forEach((d,i)=>d.classList.toggle('on', i===st.idx));
    const ph=document.getElementById(tk+'PhTxt');
    if(ph) ph.textContent=(ph.dataset.base||'')+' · pág '+(st.idx+1)+'/'+pages.length;
  }, 4000);
}
const fechaEntregaMs=p=>{ if(!p.fechaEntrega) return Infinity; const d=new Date(p.fechaEntrega+'T00:00:00'); return isNaN(d.getTime())?Infinity:d.getTime(); };
function ordenar(list){ return [...list].sort((a,b)=>(PRIO_RANK[b.prioridad]-PRIO_RANK[a.prioridad])||(fechaEntregaMs(a)-fechaEntregaMs(b))||(a.createdAt-b.createdAt)); }

/* ===== RENDER: separa estructura (solo si cambia) de cronómetros (cada seg) — un panel por tipo ===== */
let prevSig={v:null,m:null}, prevFolios={v:new Set(),m:new Set()};
function signature(list){return list.map(p=>p.folio+':'+effColor(p).k+':'+p.estado+':'+(p.tipo||'')+':'+(p.fechaEntrega||'')).join('|')}

function render(force){
  const ventas   = ordenar(pedidos.filter(p=>p.tipo!=='material'));
  const material = ordenar(pedidos.filter(p=>p.tipo==='material'));
  renderPanel('v', ventas, force);
  renderPanel('m', material, force);
  updateChips();
}

function renderPanel(tk, list, force){
  const sig=signature(list);
  if(force||sig!==prevSig[tk]){ buildPanel(tk,list); prevSig[tk]=sig; }
  else { tickPanel(tk,list); }
}

function buildPanel(tk, list){
  const heroEl=document.getElementById(tk+'Hero');
  const countEl=document.getElementById(tk+'Count');
  const queueEl=document.getElementById(tk+'Queue');
  const esMatPanel = (tk==='m');
  const hero=list[0];
  countEl.textContent=list.length;
  if(hero){
    const ec=effColor(hero), g=GRAD[ec.k];
    const persona = hero.solicitante || hero.vendedor || '\u2014';
    const v = venc(hero);
    heroEl.classList.remove('empty');
    heroEl.style.background='linear-gradient(115deg,'+g[0]+','+g[1]+')';
    const hprods=Array.isArray(hero.productos)?hero.productos:[];
    const pages=[]; for(let i=0;i<hprods.length;i+=HERO_PER_PAGE) pages.push(hprods.slice(i,i+HERO_PER_PAGE));
    if(!pages.length) pages.push([]);
    heroState[tk].pages=pages; heroState[tk].idx=0;
    const rowsOf = pg => pg.map(it=>`<div class="pitem"><div class="box"></div><div class="qty">${it.cant}</div><div><div class="desc">${it.desc||''}</div><div class="clave">${it.clave?('Clave '+it.clave):''}</div></div></div>`).join('') || '<div class="pitem" style="opacity:.6">Sin productos</div>';
    const pagesHtml = pages.map((pg,pi)=>`<div class="hpick-page${pi===0?' on':''}">${rowsOf(pg)}</div>`).join('');
    const dots = pages.length>1 ? `<div class="hpick-dots">${pages.map((_,pi)=>`<span class="hd${pi===0?' on':''}"></span>`).join('')}</div>` : '';
    const baseTxt = `POR SURTIR · ${hprods.length} PRODUCTOS · ${piezas(hero)} PIEZAS`;
    const phTxt = baseTxt + (pages.length>1?` · pág 1/${pages.length}`:'');
    const vencMeta = v ? `<div class="meta"><span class="k">ENTREGA${hero.fechaEntrega?(' · '+hero.fechaEntrega):''}</span><span class="venc-badge" style="background:${v.color}">${v.txt}</span></div>` : '';
    const destinoTxt = [hero.area, (hero.destino||hero.uso)].filter(Boolean).join(' — ');
    const destinoMeta = (esMatPanel && destinoTxt) ? `<div class="meta"><span class="k">ÁREA / DESTINO</span><span class="v" style="font-size:15px">${destinoTxt}</span></div>` : '';
    const destinoTipoMeta = hero.destinoTipo ? `<div class="meta"><span class="k">\u00bfA D\u00d3NDE VA?</span><span class="v" style="font-size:15px">${DESTINO_LABEL[hero.destinoTipo]||hero.destinoTipo}${destinoResumen(hero)?(' \u00b7 '+destinoResumen(hero)):''}</span></div>` : '';
    heroEl.innerHTML=`
      <div class="eyebrow">${esMatPanel?'SOLICITUD DE MATERIAL · OPERACIONES':'PEDIDO DE VENTAS'} · SIGUIENTE A SURTIR</div>
      <div class="htop">
        <div class="hid"><div class="folio num">${hero.folio}</div><div class="client">${hero.cliente}</div></div>
        <div class="hpick"><div class="ph"><span id="${tk}PhTxt" data-base="${baseTxt}">${phTxt}</span></div><div class="hpick-view">${pagesHtml}</div>${dots}</div>
      </div>
      <div class="metaRow">
        <div class="meta"><span class="k"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>ESPERANDO</span><span class="v timer num mono" id="${tk}HTimer">${fmt(now()-hero.createdAt)}</span></div>
        <div class="meta"><span class="k"><svg class="i" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>${esMatPanel?'SOLICITANTE':'VENDEDOR'}</span><span class="v">${persona}</span></div>
        ${vencMeta}
        ${destinoMeta}
        ${destinoTipoMeta}
        <div class="meta"><span class="k">PRIORIDAD</span><span class="prio">${hero.prioridad.replace('_',' ').toUpperCase()}</span></div>
        <div class="meta" style="margin-left:auto;align-items:flex-end"><span class="badge">${ec.label}</span></div>
      </div>`;
    startHeroCarousel(tk);
  } else {
    clearInterval(heroState[tk].timer); heroState[tk].timer=null;
    heroEl.classList.add('empty');
    heroEl.innerHTML = '<div style="font-size:14px;font-weight:800;letter-spacing:1.5px;opacity:.92;">SIN PEDIDOS EN COLA</div>';
  }
  const rest=list.slice(1);
  prevFolios[tk]=new Set(list.map(p=>p.folio));
  queueState[tk].list = rest;
  queueState[tk].page = 0;
  renderQueuePage(tk);
}

const QUEUE_PAGE_SIZE = 5;
const queueState = { v:{list:[],page:0,timer:null}, m:{list:[],page:0,timer:null} };

function cardHtml(p, isNew){
  const ec=effColor(p), c=COLORS[ec.k];
  const v=venc(p), persona=p.solicitante||p.vendedor||'';
  const prods=Array.isArray(p.productos)?p.productos:[];
  const first=prods[0]||{cant:'',desc:'\u2014'}, extra=prods.length-1;
  const items=`${first.cant}\u00d7 ${first.desc||''}${extra>0?'  +'+extra+' m\u00e1s':''}`;
  const vb = v ? `<span class="cvenc" style="background:${v.color}">${v.txt}</span>` : '';
  return `<div class="card ${isNew?'is-new':''}" data-folio="${p.folio}">
      <div class="bar" style="background:${c}"></div>
      <div class="cfolio num" style="color:${c}">${p.folio}</div>
      <div class="cmid">
        <div class="cclient">${p.cliente}</div>
        <div class="citems">${items}</div>
        <div class="cstate" style="color:${c}"><span class="sdot" style="background:${c}"></span>${ec.label} · ${persona} ${vb}</div>
        ${destinoBadgeHtml(p)}
      </div>
      <div class="cright"><div class="ctimer mono" style="color:${c}">${fmt(now()-p.createdAt)}</div><div class="cpieces">${piezas(p)} pzas</div></div>
    </div>`;
}

function renderQueuePage(tk){
  const st = queueState[tk];
  const queueEl = document.getElementById(tk+'Queue');
  if(!queueEl) return;
  const totalPages = Math.max(1, Math.ceil(st.list.length / QUEUE_PAGE_SIZE));
  if(st.page >= totalPages) st.page = 0;
  const pageItems = st.list.slice(st.page*QUEUE_PAGE_SIZE, st.page*QUEUE_PAGE_SIZE+QUEUE_PAGE_SIZE);
  queueEl.innerHTML = pageItems.map(p=>cardHtml(p, !prevFolios[tk].has(p.folio))).join('');
  const wrap = queueEl.parentElement;
  let dotsEl = wrap.querySelector('.pg-dots');
  if(totalPages>1){
    if(!dotsEl){ dotsEl=document.createElement('div'); dotsEl.className='pg-dots'; wrap.appendChild(dotsEl); }
    dotsEl.innerHTML = Array.from({length:totalPages}).map((_,i)=>`<span class="pd${i===st.page?' on':''}"></span>`).join('');
  } else if(dotsEl){ dotsEl.remove(); }

  clearInterval(st.timer); st.timer=null;
  if(totalPages>1){
    st.timer = setInterval(()=>{
      st.page = (st.page+1) % Math.max(1, Math.ceil(st.list.length/QUEUE_PAGE_SIZE));
      renderQueuePage(tk);
    }, 6000);
  }
}

function tickPanel(tk, list){
  const hero=list[0], ht=document.getElementById(tk+'HTimer');
  if(hero&&ht) ht.textContent=fmt(now()-hero.createdAt);
  const queueEl=document.getElementById(tk+'Queue');
  queueState[tk].list.forEach(p=>{const el=queueEl.querySelector('[data-folio="'+p.folio+'"] .ctimer');if(el)el.textContent=fmt(now()-p.createdAt)});
}

function updateChips(){
  const a=pedidos.filter(p=>['finalizado','cancelado','entregado'].indexOf(p.estado)===-1);
  cActivos.textContent=a.length;
  const nParciales=a.filter(p=>p.estado==='parcial').length;
  cParciales.textContent=nParciales;
  cParciales.closest('.chip').classList.toggle('alerta-viva', nParciales>0);
  cPorVencer.textContent=a.filter(p=>['amarillo','naranja'].includes(effColor(p).k)).length;
  const nRetraso=a.filter(p=>effColor(p).k==='rojo').length;
  cRetraso.textContent=nRetraso;
  cRetraso.closest('.chip').classList.toggle('chip-critico', nRetraso>0);
}

/* ===== Sonido (Web Audio) ===== */
function beep(){try{const ac=new(window.AudioContext||window.webkitAudioContext)();[880,1320].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ac.destination);const t=ac.currentTime+i*0.16;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.2,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);o.start(t);o.stop(t+0.16)})}catch(e){}}

}

// ── Franja de cajas en movimiento: refuerzo visual + indicador de "en vivo" ──
// Se decora sola según la fecha (minimalista, nunca infantil) y según cumpleaños
// que el administrador haya registrado en Firestore (config/cumpleanos).
(function(){
  const track = document.getElementById('tvMarqueeTrack');
  if(!track) return;

  const ICONO_CAJA = '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>';
  const ICONO_CALABAZA = '<path d="M12 2v3"/><ellipse cx="12" cy="14" rx="8" ry="7"/><path d="M9 12s.8 1.5 3 1.5 3-1.5 3-1.5"/>';
  const ICONO_FANTASMA = '<path d="M6 20V11a6 6 0 0 1 12 0v9l-2.5-2-2 2-1.5-1.5-1.5 1.5-2-2z"/><circle cx="9.5" cy="11" r=".6" fill="currentColor"/><circle cx="14.5" cy="11" r=".6" fill="currentColor"/>';
  const ICONO_REGALO = '<rect x="4" y="9" width="16" height="11" rx="1"/><path d="M4 13h16"/><path d="M12 9v11"/><path d="M8 9c-1.7 0-3-1-3-2.5S6 4 7.5 4C9.5 4 12 6.5 12 9c0-2.5 2.5-5 4.5-5C18 4 19 5.5 19 6.5S17.7 9 16 9"/>';
  const ICONO_ESFERA = '<circle cx="12" cy="14" r="7"/><path d="M12 7V3"/><path d="M9.5 3h5"/>';
  const ICONO_ARBOL = '<path d="M12 2 7 10h3l-4 6h4l-3 6h10l-3-6h4l-4-6h3z"/>';
  const ICONO_BANDERA = '<path d="M5 21V4"/><path d="M5 4h14l-3 4 3 4H5"/>';
  const ICONO_SOMBRERO = '<path d="M4 16c0-4 3.5-8 8-8s8 4 8 8"/><ellipse cx="12" cy="16" rx="9" ry="2"/><path d="M9 8V5a3 3 0 0 1 6 0v3"/>';
  const ICONO_FUEGO = '<path d="M12 2v5"/><path d="M12 2 9 6"/><path d="M12 2l3 4"/><circle cx="12" cy="14" r="6"/>';
  const ICONO_PASTEL = '<rect x="4" y="12" width="16" height="8" rx="1"/><path d="M4 16h16"/><path d="M8 12V9a1 1 0 0 1 2 0v3"/><path d="M14 12V9a1 1 0 0 1 2 0v3"/><path d="M9 6c0-1 1-1 1-2s-1-1-1-2"/><path d="M15 6c0-1 1-1 1-2s-1-1-1-2"/>';

  // Fecha de hoy en Chihuahua (usa hora local del navegador, suficiente para esto)
  const hoy = new Date();
  const mes = hoy.getMonth()+1, dia = hoy.getDate();
  const enRango = (m1,d1,m2,d2)=>{
    const marca=(m,d)=>m*100+d, t=marca(mes,dia);
    const a=marca(m1,d1), b=marca(m2,d2);
    return a<=b ? (t>=a && t<=b) : (t>=a || t<=b); // soporta rangos que cruzan fin de año (Navidad)
  };

  let tema = null; // {nombre, color, iconos}
  if (enRango(10,25,11,1))       tema = {nombre:'Halloween', color:'#F26B21', iconos:[ICONO_CALABAZA,ICONO_FANTASMA,ICONO_CAJA]};
  else if (enRango(12,1,1,6))    tema = {nombre:'Navidad', color:'#12A150', iconos:[ICONO_REGALO,ICONO_ESFERA,ICONO_ARBOL,ICONO_CAJA]};
  else if (enRango(9,14,9,16))   tema = {nombre:'16 de Septiembre', color:'#12A150', iconos:[ICONO_BANDERA,ICONO_SOMBRERO,ICONO_FUEGO,ICONO_CAJA]};

  function pintarFranja(iconos, colorTema){
    if (colorTema) document.documentElement.style.setProperty('--tv-theme', colorTema);
    const set = iconos.map((path,i)=>`<span class="tvm-box${i===0&&iconos.length<4?' bday':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${path}</svg></span>`);
    // Se arma una tanda mezclando los íconos del tema varias veces, más cajas de relleno para que no se sature.
    let tanda = [];
    for (let i=0;i<14;i++) tanda.push(set[i % set.length]);
    const html = tanda.join('') ;
    track.innerHTML = html + html; // se duplica para que el recorrido sea continuo, sin salto
  }

  function aplicarTemporada(iconoExtraCumple){
    const iconos = tema ? tema.iconos.slice() : [ICONO_CAJA];
    if (iconoExtraCumple) iconos.unshift(iconoExtraCumple);
    pintarFranja(iconos, tema ? tema.color : null);
    const etiqueta = document.getElementById('tvTemporada');
    if (etiqueta){
      const partes = [];
      if (tema) partes.push(tema.nombre);
      if (iconoExtraCumple) partes.push('🎂 Cumpleaños hoy');
      if (partes.length){ etiqueta.style.display='flex'; etiqueta.textContent = partes.join(' · '); }
      else etiqueta.style.display='none';
    }
  }

  // Cumpleaños: opcional, se lee de Firestore si ya está disponible (config/cumpleanos → {lista:[{nombre,mes,dia}]}).
  // El módulo de Firebase carga después que este script, así que se expone un gancho para que lo llame en cuanto esté listo.
  aplicarTemporada(null); // pinta de inmediato con lo que ya sabemos, sin esperar red
  window.__tvComprobarCumpleanos = function(){
    try{
      if (!window.db) return;
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js').then(fs=>{
        return fs.getDoc(fs.doc(window.db,'config','cumpleanos'));
      }).then(snap=>{
        const lista = (snap && snap.exists() && Array.isArray(snap.data().lista)) ? snap.data().lista : [];
        const hayHoy = lista.some(c=>Number(c.mes)===mes && Number(c.dia)===dia);
        if (hayHoy) aplicarTemporada(ICONO_PASTEL);
      }).catch(()=>{});
    }catch(e){}
  };
})();



// ── Wake Lock: le pide directamente al navegador que NO apague/duerma la pantalla. ──
// Esto es lo que de verdad evita la suspensión (la franja de cajas es solo un apoyo visual).
// Si el navegador de la TV no lo soporta, falla en silencio y no rompe nada.
(function(){
  let wakeLock = null;
  async function pedirWakeLock(){
    try{
      if('wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', ()=>{ console.log('[TV] wakeLock liberado, se volverá a pedir si la pestaña vuelve a estar visible'); });
        console.log('[TV] wakeLock activo: la pantalla no debería dormirse mientras esta pestaña esté visible.');
      } else {
        console.warn('[TV] Este navegador no soporta Wake Lock. Revisa la configuración de ahorro de energía de la TV.');
      }
    }catch(e){ console.warn('[TV] No se pudo activar wakeLock:', e); }
  }
  pedirWakeLock();
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') pedirWakeLock(); });
})();

render(true); setInterval(()=>render(false),1000);
</script>

const auth = getAuth(app);
window.db = db; // para que otras partes de la página (fuera de este módulo) puedan leer configuración
if (window.__tvComprobarCumpleanos) window.__tvComprobarCumpleanos();

// Normaliza createdAt: Timestamp | número(ms) | ISO | {seconds} → ms
function toMs(v){
  if(v==null) return Date.now();
  if(typeof v==='number') return v;
  if(typeof v==='string'){ const t=Date.parse(v); return isNaN(t)?Date.now():t; }
  if(typeof v.toMillis==='function') return v.toMillis();
  if(v.seconds!=null) return v.seconds*1000;
  return Date.now();
}

let primeraCarga = true;
let vistos = new Set();
let escuchando = false;

// Aviso grande y visible dentro del panel principal (nunca fallar en silencio)
function avisoTV(titulo, detalle){
  const board = document.querySelector('.board-split');
  if(board){
    board.innerHTML = '<div style="grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 30px;color:#0C2740;">'
      + '<div style="font-size:26px;font-weight:800;margin-bottom:14px;">'+titulo+'</div>'
      + '<div style="font-size:16px;opacity:.85;max-width:640px;line-height:1.6;">'+detalle+'</div></div>';
  }
  console.warn('[TV]', titulo, String(detalle).replace(/<[^>]+>/g,''));
}

function iniciarEscucha(){
  if(escuchando) return; escuchando = true;
  onSnapshot(collection(db,'surtidos'), (snap)=>{
    const lista = [];
    const nuevos = [];
    snap.forEach(docu=>{
      const d = docu.data() || {};
      const estado = d.estado || 'pendiente';
      if(estado === 'finalizado' || estado === 'cancelado' || estado === 'entregado') return;    // fuera del tablero
      const p = {
        id: docu.id,
        folio: String(d.folio!=null ? d.folio : docu.id),
        cliente: d.cliente || '\u2014',
        vendedor: d.vendedor || '\u2014',
        prioridad: d.prioridad || 'normal',
        estado,
        createdAt: toMs(d.createdAt),
        tipo: d.tipo || 'venta',
        fechaEntrega: d.fechaEntrega || '',
        solicitante: d.solicitante || '',
        area: d.area || '',
        destino: d.destino || '',
        uso: d.uso || d.destino || '',
        destinoTipo: d.destinoTipo || '',
        destinoPaqueteria: d.destinoPaqueteria || '',
        destinoGuia: d.destinoGuia || '',
        destinoDireccion: d.destinoDireccion || '',
        destinoAlmacenOrigen: d.destinoAlmacenOrigen || '',
        destinoAlmacenDestino: d.destinoAlmacenDestino || '',
        productos: Array.isArray(d.productos) ? d.productos.map(it=>({
          clave: it.clave || '',
          cant: Number(it.cant)||0,
          desc: it.desc || it.descripcion || ''
        })) : []
      };
      lista.push(p);
      if(!primeraCarga && !vistos.has(p.id)) nuevos.push(p);
      vistos.add(p.id);
    });
    if(window.__setPedidos) window.__setPedidos(lista);
    if(!primeraCarga && nuevos.length && window.__flashNuevo){
      window.__flashNuevo(nuevos.sort((a,b)=>b.createdAt-a.createdAt)[0]);
    }
    primeraCarga = false;
  }, (err)=>{
    console.error('[TV surtidos] onSnapshot error:', err);
    if(err && (err.code === 'permission-denied' || /permission/i.test(err.message||''))){
      avisoTV('Sin permisos para leer los pedidos',
        'Firestore rechaz\u00f3 la lectura de <b>surtidos</b>. Permite lectura p\u00fablica de esa colecci\u00f3n en las Reglas, o activa el proveedor <b>An\u00f3nimo</b> en Authentication.');
    } else {
      avisoTV('Error de conexi\u00f3n con Firestore', (err && (err.message||err.code)) || 'Error desconocido');
    }
  });
}

// Sesi\u00f3n an\u00f3nima para poder leer aun sin usuario logueado.
onAuthStateChanged(auth, (user)=>{ if(user) iniciarEscucha(); });
signInAnonymously(auth).catch((err)=>{
  console.error('[TV auth] signInAnonymously:', err);
  if(err && err.code === 'auth/operation-not-allowed'){
    avisoTV('Falta activar el acceso an\u00f3nimo',
      'En Firebase \u2192 Authentication \u2192 Sign-in method, activa el proveedor <b>An\u00f3nimo</b>. (Alternativa: permitir lectura p\u00fablica de <b>surtidos</b> en las Reglas.)');
  }
  // Aun as\u00ed intenta leer, por si las Reglas permiten lectura p\u00fablica:
  iniciarEscucha();
});
</script>
</body>
</html>
