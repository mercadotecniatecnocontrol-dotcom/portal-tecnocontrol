<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operaciones · Pantalla TV</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1D2E73;--rojo:#E7402B;--linea:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f1f5f9;color:#1e293b;font-family:'Plus Jakarta Sans',-apple-system,sans-serif;overflow:hidden}
#top{display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--navy);color:#fff;border-bottom:4px solid var(--rojo);height:52px}
#top h1{font-size:19px;font-weight:800;white-space:nowrap}
.chip{font-size:15px;background:rgba(255,255,255,.14);padding:5px 12px;border-radius:9px}
#reloj{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
#estado{font-size:12px;opacity:.75}
#cal{position:absolute;top:52px;left:0;right:0;bottom:0;overflow:hidden;background:#fff}
#grid{display:grid;grid-template-columns:var(--colTec,200px) repeat(7,minmax(0,1fr));height:100%;font-size:var(--fs,12px)}
.hd{background:#fff;border-bottom:2px solid var(--linea);padding:2px 4px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.hd small{font-size:1em;font-weight:700;color:#64748b}
.hd b{display:inline-flex;align-items:center;justify-content:center;font-size:1.25em;min-width:1.9em;height:1.9em;border-radius:50%}
.hd.hoy b{background:var(--navy);color:#fff}
.hd.tec{justify-content:flex-start;font-weight:700;color:#64748b;padding-left:10px}
.tecn{border-bottom:1px solid var(--linea);padding:0 8px;display:flex;align-items:center;gap:6px;min-height:0;overflow:hidden}
.av{width:1.9em;height:1.9em;border-radius:50%;background:var(--navy);color:#fff;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tecn .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tecn .p{display:var(--verPuesto,none);font-size:.85em;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.celda{border-bottom:1px solid var(--linea);border-left:1px solid #eef2f7;padding:1px 2px;display:flex;flex-direction:row;gap:2px;min-height:0;min-width:0;overflow:hidden}
.celda.hoy{background:#f5f8ff}
.srv{flex:1 1 0;min-width:0;border-radius:4px;padding:0 4px;line-height:1.15;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative;border:1px solid rgba(0,0,0,.12)}
.srv .t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv .d{display:var(--verDet,none);font-size:.85em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv .dot{display:none}
.srv.hecho{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.62) 0 7px,rgba(255,255,255,.42) 7px 14px)!important;box-shadow:inset 3px 0 0 #15803d}
.srv.hecho .t::after{content:' ✓';color:#15803d}
.tag{display:inline-block;background:#0f766e;color:#fff;border-radius:3px;padding:0 3px;font-size:.78em;margin-right:3px;font-weight:800}
.srv.curso{box-shadow:inset 0 0 0 2px #0284c7}
.srv.atrasado{box-shadow:inset 0 0 0 2px var(--rojo)}
.srv.nuevo{animation:brillo 1.1s ease-in-out 8}
@keyframes brillo{50%{box-shadow:inset 0 0 0 3px #FACC15}}
.mas{flex:0 0 auto;align-self:center;font-weight:800;color:#475569;padding:0 2px}
.aus{flex:1;border-radius:4px;background:repeating-linear-gradient(45deg,#e2e8f0,#e2e8f0 5px,#f1f5f9 5px,#f1f5f9 10px);display:flex;align-items:center;justify-content:center;font-weight:700;color:#475569;white-space:nowrap;overflow:hidden}
#ticker{flex:1;min-width:0;overflow:hidden;white-space:nowrap;font-size:14px;background:rgba(255,255,255,.12);border-radius:8px;padding:5px 10px}
#flash{position:fixed;right:30px;bottom:30px;max-width:620px;background:#fff;border-radius:18px;padding:20px 24px;border-left:12px solid var(--rojo);box-shadow:0 20px 60px rgba(0,0,0,.35);display:none;z-index:9}
#flash b{font-size:24px;display:block}#flash div{font-size:19px;margin-top:6px}
#activar{position:fixed;inset:0;background:rgba(11,20,64,.93);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;cursor:pointer;text-align:center}
#activar b{font-size:32px}#activar span{font-size:17px;opacity:.8}
</style>
</head>
<body>
<div id="top">
  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
  <h1>Calendario de Operaciones</h1>
  <div class="chip" id="plaza"></div>
  <div class="chip" id="semana"></div>
  <div id="ticker">Sin avisos nuevos</div><div id="estado">Cargando…</div>
  <div id="reloj"></div>
</div>
<div id="cal"><div id="grid"></div></div>
<div id="flash"></div>
<div id="activar" onclick="tvActivar()">
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
  <b>Toca la pantalla para activar el sonido</b>
  <span>Solo se hace una vez. Después la pantalla avisa sola.</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Pantalla TV de Operaciones (misma vista Semana del portal: técnicos × días). Solo lectura.
// Se actualiza cada 20 s y baja sola si hay más técnicos de los que caben.
// Plaza opcional por link: operaciones-tv.html?plaza=Juárez (sin nada = todas las plazas).
const SB=supabase.createClient('https://vlbyjoqessxcmkejcujp.supabase.co','sb_publishable_18A7j06AwZqdw3gmqUDJHQ_Twu0t2a8');
const PLAZA=new URLSearchParams(location.search).get('plaza')||'';
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('plaza').textContent=PLAZA?'Plaza '+PLAZA:'Todas las plazas';

// ── Colores: mismas familias que el calendario del portal ──
const FAM_TECNO=[["Cambio de botas","#FF6D00",/bota/],["Cambio de contenedor","#827717",/contenedor/],["Retank","#E53935",/re-?\s?tank/],["Integridad mecánica","#AD1457",/integridad/],["Hermeticidad","#00897B",/hermetic/],["Cableado","#1E88E5",/cablead|canaliz|conexi/],["Sondas y consolas","#00B4D8",/sonda|consola|termistor/],["Calibración","#00A86B",/calibra/],["Dispensarios","#0277BD",/dispens|manguer/],["Eléctrico","#546E7A",/el[eé]ctric/],["Mantenimiento","#43A047",/manten|mtto/],["Pólizas","#7CB342",/p[oó]liza/],["Obra civil","#8D6E63",/obra civil|pintura|losa|concreto/],["Tótem e imagen","#EC4899",/t[oó]tem|imagen|anuncio/],["Supervisión","#0097A7",/supervis/]];
const FAM_JOMAR=[["Sin actividad","#9aa1ad",/cancel|vacacion|d[ií]a libre|inh[aá]bil|incapac/],["Dictamen","#2340D8",/dictamen|dise[nñ]o|construcci/],["Alto flujo","#111827",/alto flujo/],["SCFI","#FFEB3B",/scfi/],["Calibraciones","#FFC107",/calib|cali+bra/],["SASISOPA","#8E24AA",/sasisopa/],["Anexo 21 y 22","#AEEA00",/an?e?n?xo|aenxo|aneo|\bvh\b/],["Calidad","#9E2A2B",/calidad/],["ASEA","#2EE6D6",/asea|op y mtto|op y mto/],["Tanques","#FB8C00",/tanque/],["Supervisión","#3E2723",/supervis|revisi/]];
let CATALOGO=[];
function esJomar(f){return f.tipoFolio==='inspeccion'||f.origen==='connecteam'||f.esJomar===true||/jo\s?mar/i.test(f.clienteNombre||'');}
function familia(t,j){const x=norm(t);const r=(j?FAM_JOMAR:FAM_TECNO).find(fm=>fm[2].test(x));return r?r[1]:(j?'#26A69A':'#5C6BC0');}
function colorFolio(f){
  if(f.conceptoGeneral==='Traslado') return '#64748b';
  if(f.conceptoGeneral) return '#0e7490';
  const j=esJomar(f), rec=f.servicioCatalogoId&&CATALOGO.find(r=>r.id===f.servicioCatalogoId);
  if(rec&&rec.colorCalendario) return rec.colorCalendario;
  if(f.tipoFolio==='laboratorio') return '#9d50dd';
  const sp=(f.serviciosProgramados||[]).map(x=>x&&x.nombre).filter(Boolean).join(' ');
  for(const t of [rec&&rec.nombre,f.normaInspeccion,sp,[f.categoriaServicio,f.estacion,f.comentarios].join(' ')]){ if(!t) continue; const c=familia(t,j); if(c!==(j?'#26A69A':'#5C6BC0')) return c; }
  return j?'#26A69A':'#5C6BC0';
}
function textoSobre(hex){const h=hex.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return (0.299*r+0.587*g+0.114*b)>160?'#1f2937':'#ffffff';}

// ── Fechas y servicios de varios días (misma regla que el portal) ──
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mas=(f,n)=>{const d=new Date(f+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);};
const entre=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
function adelantado(f){const s=String(f.fechaSolucion||'').slice(0,10),p=String(f.fechaProgramada||'').slice(0,10);return s&&p&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&s<p?s:'';}
function fechaFin(f){const i=String(f.fechaProgramada||'').slice(0,10);if(!i)return'';const a=adelantado(f);if(a)return a;
  if(f.fechaFinProgramada&&f.fechaFinProgramada>=i)return f.fechaFinProgramada;
  if(f.duracionUnidad==='dias'&&Number(f.duracionValor)>1)return mas(i,Math.ceil(Number(f.duracionValor))-1);return i;}
function datos(f){if(!f.fechaProgramada)return null;let[fe,h]=f.fechaProgramada.split('T');const a=adelantado(f);if(a)fe=a;
  const[hh,mm]=(h||'00:00').split(':').map(Number);return{fecha:fe,hora:hh+(mm||0)/60,sinHora:!h,traslado:f.tiempoTrasladoHrs||0,ejecucion:f.tiempoEjecucionHrs||0};}
function datosDia(f,k){const b=datos(f);if(!b)return null;const fin=fechaFin(f);if(k<b.fecha||k>fin)return null;if(fin===b.fecha)return b;
  const dias=entre(b.fecha,fin)+1,idx=entre(b.fecha,k);
  if((f.diasTraslado||[]).includes(k)||(idx===0&&f.trasladoDiaInicio)||(idx===dias-1&&f.trasladoDiaFin))
    return{fecha:k,hora:idx===0?b.hora:8,traslado:Number(f.horasTrasladoDia)||8,ejecucion:0,dia:idx+1,dias,multi:true,diaTraslado:idx===0?'ida':idx===dias-1?'regreso':'en camino'};
  const cap=Math.max(1,18-b.hora-b.traslado);if(idx===0)return{...b,ejecucion:cap,dia:1,dias,multi:true};
  const resto=(Number(b.ejecucion)||0)-cap-10*(dias-2);
  if(idx===dias-1&&resto>0&&resto<10)return{fecha:k,hora:8,traslado:b.traslado,ejecucion:resto,dia:idx+1,dias,multi:true};
  return{fecha:k,hora:8,traslado:0,ejecucion:10,dia:idx+1,dias,multi:true};}
const fmtHora=d=>{if(d>=24)return 'hora inválida';let h=Math.floor(d),m=Math.round((d-h)*60);if(m===60){h++;m=0;}return h+':'+String(m).padStart(2,'0');};
const txtH=h=>{if(!h)return'';if(h<1)return Math.round(h*60)+' min';const a=Math.floor(h),m=Math.round((h-a)*60);return a+' h'+(m?' '+m+' min':'');};
function estado(f){if(f.completadoEn||f.fechaSolucion||f.cerradoPorCuadrilla)return'hecho';if(f.iniciadoEn)return'curso';if(f.conceptoGeneral==='Atención a folios'||f.conceptoGeneral==='Guardia')return'';
  const t=Date.parse(f.fechaProgramada);if(t&&!/T(2[4-9]|[3-9]\d)/.test(f.fechaProgramada)&&Date.now()-t>36e5)return'atrasado';return'';}
const titulo=f=>f.estacion||f.clienteNombre||f.conceptoGeneral||'Servicio';
const tecnicos=f=>(f.tecnicosAsignadosNombres||[]).join(', ')||f.tecnicoResponsableNombre||'Sin técnico';

// ── Técnicos: los mismos que salen en el calendario del portal ──
const RE_ADMIN=/gerente|subgerente|coordinador|auxiliar|consulta|administra|director|contab|compras|gestor|recursos humanos|ingresos|egresos|pagos|ventas|marketing|almac|flotilla|contralor/i;
const FORZAR=['u.nunez@tecnocontrol.com.mx'];
function esAdmin(t){if(FORZAR.includes(norm(t.correo)))return false;if(t.ocultarEnListas===true)return true;if(t.ocultarEnListas===false)return false;
  const p=t.puesto||'';if(/t[ée]cnico/i.test(p))return false;return RE_ADMIN.test(p);}
const iniciales=n=>String(n||'').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();

// ── Sonido, voz y avisos ──
let ac=null,sonido=false,avisos=[],cola=[],flashOn=false,previo=null;const avisados=new Set();
function tvActivar(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();}catch(e){}sonido=true;document.getElementById('activar').remove();if('speechSynthesis' in window)speechSynthesis.getVoices();}
function tono(u){if(!sonido||!ac)return;(u?[880,660,880,660]:[660,880]).forEach((fq,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.28;o.frequency.value=fq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.27);});}
function voz(t){return;/* 5-nov-2026: sin voz */if(!sonido||!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='es-MX';u.rate=.95;const v=speechSynthesis.getVoices().find(x=>/^es/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u);}
function avisar(tipo,tit,det,urg){avisos.unshift({tipo,tit,det,h:new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})});avisos=avisos.slice(0,10);
  document.getElementById('ticker').innerHTML=avisos.slice(0,3).map(a=>'<b>'+a.h+' '+esc(a.tit)+':</b> '+esc(a.det)).join(' &nbsp;|&nbsp; ');
  cola.push({tit,det,urg});if(!flashOn)sigFlash();}
function sigFlash(){const a=cola.shift(),el=document.getElementById('flash');if(!a){flashOn=false;el.style.display='none';return;}
  flashOn=true;el.style.borderLeftColor=a.urg?'#E7402B':'#3B82F6';el.innerHTML='<b>'+esc(a.tit)+'</b><div>'+esc(a.det)+'</div>';el.style.display='block';
  tono(a.urg);setTimeout(()=>voz(a.tit+'. '+a.det),900);setTimeout(sigFlash,9000);}
function comparar(m){
  if(!previo){m.forEach((f,id)=>{if(estado(f)==='atrasado')avisados.add(id);});return;}
  m.forEach((f,id)=>{const a=previo.get(id),q=titulo(f)+' · '+tecnicos(f);
    if(!a){
      if(f.completadoEn||f.fechaSolucion)avisar('ok','Servicio terminado',q,false);
      else if((f.atenciones||[]).length)avisar('','Evidencia del técnico',q,false);
      else{avisar('','Servicio nuevo',q+' · '+String(f.fechaProgramada||'').replace('T',' '),false);f._nuevo=true;}}
    else{
      if(String(a.fechaProgramada).slice(0,16)!==String(f.fechaProgramada).slice(0,16))avisar('cam','Reprogramación',titulo(f)+': ahora '+String(f.fechaProgramada).replace('T',' '),false);
      else if(tecnicos(a)!==tecnicos(f))avisar('cam','Cambio de técnico',titulo(f)+': '+tecnicos(f),false);
      if(String(f.comentarios||'').length>String(a.comentarios||'').length)avisar('','Aviso de técnico',q,false);
      if(!(a.completadoEn||a.fechaSolucion)&&(f.completadoEn||f.fechaSolucion))avisar('ok','Servicio terminado',q,false);
      if(!a.cancelado&&f.cancelado)avisar('urg','Servicio cancelado',q,true);
    }
    if(estado(f)==='atrasado'&&!avisados.has(id)){avisados.add(id);avisar('urg','Servicio atrasado',q+' · no ha iniciado',true);}
  });}

// ── Lo que el técnico ya hizo con evidencia (igual que el portal, 3-nov-2026) ──
function fechaVisita(v){const x=String((v&&(v.fin||v.inicio))||'');if(!x)return'';if(/Z$|[+-]\d{2}:?\d{2}$/.test(x)){const d=new Date(x);if(!isNaN(d))return iso(d);}return x.slice(0,10);}
function horaVisita(x){x=String(x||'');if(!x)return null;if(/Z$|[+-]\d{2}:?\d{2}$/.test(x)){const d=new Date(x);return isNaN(d)?null:d.getHours()+d.getMinutes()/60;}const m=x.match(/T(\d{2}):(\d{2})/);return m?Number(m[1])+Number(m[2])/60:null;}
const AUXC=new Map();
function tecsDeTexto(txt){const c=String(txt||'').trim();if(!c)return[];if(AUXC.has(c))return AUXC.get(c);
  const ts=TEC.map(t=>({id:t.id,p:norm(t.nombre).split(/\s+/).filter(Boolean)})),ids=new Set();
  c.split(/[,;\/\n]+|\s+y\s+/i).map(x=>norm(x).split(/\s+/).filter(w=>w.length>1)).filter(w=>w.length).forEach(pal=>{
    const cand=ts.filter(t=>pal.every(w=>t.p.some(tp=>tp===w||(w.length>=4&&tp.startsWith(w)))));if(cand.length===1)ids.add(cand[0].id);});
  const r=[...ids];AUXC.set(c,r);return r;}
function visitaDe(f,t,k){const ct=norm(t.correo),nt=norm(t.nombre);let mejor=null;
  (f.atenciones||[]).forEach(v=>{if(!v||fechaVisita(v)!==k)return;
    const esTec=(v.tecnicoId&&v.tecnicoId===t.id)||(ct&&norm(v.correo)===ct)||(!v.tecnicoId&&!v.correo&&nt&&norm(v.nombre)===nt);
    const esAux=!esTec&&tecsDeTexto(v.tecnicoAuxiliar).includes(t.id);if(!esTec&&!esAux)return;
    const fi=horaVisita(v.fin),ii=horaVisita(v.inicio&&fechaVisita({fin:v.inicio})===k?v.inicio:null),h=ii!==null?ii:(fi!==null?Math.max(0,fi-1):8);
    const d={fecha:k,hora:h,traslado:0,ejecucion:Math.max(.5,fi!==null&&fi>h?fi-h:1),realizado:true,rol:esTec?'tecnico':'auxiliar',resultado:v.resultado||''};
    if(!mejor||(d.rol==='tecnico'&&mejor.rol!=='tecnico'))mejor=d;});return mejor;}
function delTecnico(folios,t,k){const prog=folios.filter(f=>(f.tecnicosAsignadosIds||[]).includes(t.id)).map(f=>({f,d:datosDia(f,k)})).filter(o=>o.d);
  const ya=new Set(prog.map(o=>o.f._id));folios.forEach(f=>{if(ya.has(f._id)||!(f.atenciones||[]).length)return;const d=visitaDe(f,t,k);if(d){prog.push({f,d});ya.add(f._id);}});
  return prog.sort((a,b)=>a.d.hora-b.d.hora);}

// ── Carga y dibujo ──
let TEC=[],AUS=[];
async function cargarFijos(){
  const [t,a,c]=await Promise.all([
    SB.from('ops_docs').select('doc_id,datos').eq('coleccion','ops_tecnicos'),
    SB.from('ops_docs').select('datos').eq('coleccion','ops_tecnico_ausencias'),
    SB.from('ops_docs').select('doc_id,datos').eq('coleccion','ops_servicios_catalogo')]);
  if(!t.error)TEC=t.data.map(r=>({id:r.doc_id,...r.datos})).filter(x=>(x.estatus||'activo')==='activo'&&!esAdmin(x)).sort((x,y)=>String(x.nombre||'').localeCompare(String(y.nombre||''),'es',{sensitivity:'base'}));
  if(!a.error)AUS=a.data.map(r=>r.datos).filter(x=>x&&x.tecnicoId);
  if(!c.error)CATALOGO=c.data.map(r=>({id:r.doc_id,...r.datos}));
}
function lunes(){const d=new Date();d.setHours(12,0,0,0);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d);}
async function cargar(){
  try{
    const ini=lunes(),fin=mas(ini,6);
    const[q1,q2,q3]=await Promise.all([
      SB.from('ops_docs').select('doc_id,datos').eq('coleccion','ops_folios').gte('datos->>fechaProgramada',mas(ini,-45)).lte('datos->>fechaProgramada',fin+'T99'),
      SB.from('ops_docs').select('doc_id,datos').eq('coleccion','ops_folios').gte('datos->>fechaSolucion',ini).lte('datos->>fechaSolucion',fin+'T99'),
      SB.from('ops_docs').select('doc_id,datos').eq('coleccion','ops_folios').gte('datos->>ultimaEvidenciaEn',ini).lte('datos->>ultimaEvidenciaEn',fin+'T99')]);
    if(q1.error)throw q1.error;
    const vistos=new Set(),data=[];[q1,q2,q3].forEach(q=>(q.data||[]).forEach(r=>{if(!vistos.has(r.doc_id)){vistos.add(r.doc_id);data.push(r);}}));
    const m=new Map();
    (data||[]).forEach(r=>{const f=r.datos||{};if(f.cancelado&&!(previo&&previo.has(r.doc_id)))return;
      if(PLAZA&&norm(f.plaza||'Chihuahua')!==norm(PLAZA))return;
      const a=adelantado(f)||String(f.fechaProgramada||'').slice(0,10);
      const conVisita=(f.atenciones||[]).some(v=>{const x=fechaVisita(v);return x>=ini&&x<=fin;});
      if(!conVisita&&(!a||a>fin||fechaFin(f)<ini))return;f._id=r.doc_id;m.set(r.doc_id,f);});
    comparar(m);previo=m;pintar(m,ini);
    document.getElementById('estado').textContent='Actualizado '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  }catch(e){document.getElementById('estado').textContent='Sin conexión, reintentando…';}
}
function tarjeta(f,k,dd){const d=dd||datosDia(f,k);if(!d)return'';const c=colorFolio(f),tx=textoSobre(c),e=d.realizado?(d.resultado==='finalizado'||!d.resultado?'hecho':''):estado(f);
  const tag=d.realizado?'<span class="tag">'+(d.rol==='auxiliar'?'AUXILIAR':d.resultado==='avance_dia'?'AVANCE':d.resultado&&d.resultado!=='finalizado'?'VISITA':'HECHO')+'</span>':'';
  const det=(d.diaTraslado?'TRASLADO ('+d.diaTraslado+') · ':'')+(d.multi?'Día '+d.dia+'/'+d.dias+' · ':'')+(d.sinHora?'Sin hora':fmtHora(d.hora))+(d.ejecucion>0?' · trabajo '+txtH(d.ejecucion):'')+(d.traslado>0?' · traslado '+txtH(d.traslado):'');
  const hr=d.sinHora?'':fmtHora(d.hora)+' ';
  return '<div class="srv '+e+(f._nuevo?' nuevo':'')+'" style="background:'+c+';color:'+tx+'" title="'+esc(titulo(f)+' · '+det)+'"><div class="t">'+tag+esc((d.multi?d.dia+'/'+d.dias+' ':'')+hr+titulo(f))+'</div><div class="d">'+esc(det)+'</div></div>';}
function pintar(m,ini){
  const hoy=iso(new Date()),dias=[...Array(7)].map((_,i)=>mas(ini,i)),nom=['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];
  const f0=new Date(ini+'T12:00:00'),f6=new Date(dias[6]+'T12:00:00'),mes=x=>x.toLocaleDateString('es-MX',{day:'numeric',month:'short'});
  document.getElementById('semana').textContent=mes(f0)+' – '+mes(f6);
  const folios=[...m.values()].filter(f=>!f.cancelado);
  let tecs=TEC;
  if(PLAZA){const conServ=new Set(folios.flatMap(f=>f.tecnicosAsignadosIds||[]));tecs=TEC.filter(t=>conServ.has(t.id)||norm(t.plaza)===norm(PLAZA));}
  let h='<div class="hd tec">TÉCNICO · PUESTO</div>'+dias.map((k,i)=>'<div class="hd'+(k===hoy?' hoy':'')+'"><small>'+nom[i]+'</small><b>'+Number(k.slice(8))+'</b></div>').join('');
  tecs.forEach(t=>{
    h+='<div class="tecn"><div class="av">'+esc(iniciales(t.nombre))+'</div><div><div class="n">'+esc(t.nombre)+'</div><div class="p">'+esc(t.puesto||'')+(t.plaza?' · '+esc(t.plaza):'')+'</div></div></div>';
    dias.forEach(k=>{
      const aus=AUS.find(a=>a.tecnicoId===t.id&&a.fechaInicio<=k&&a.fechaFin>=k);
      const del=delTecnico(folios,t,k);
      const vis=del.length>MAXC?del.slice(0,MAXC-1):del;
      h+='<div class="celda'+(k===hoy?' hoy':'')+'">'+(aus&&!del.length?'<div class="aus">'+esc(aus.tipo||'Ausente')+'</div>':'')+vis.map(o=>tarjeta(o.f,k,o.d)).join('')+(del.length>vis.length?'<span class="mas">+'+(del.length-vis.length)+'</span>':'')+'</div>';
    });
  });
  const sinTec=folios.filter(f=>f.fechaProgramada&&!(f.tecnicosAsignadosIds||[]).some(id=>tecs.some(t=>t.id===id))&&!(f.atenciones||[]).length);
  if(sinTec.length){h+='<div class="tecn"><div class="av" style="background:#E7402B">!</div><div><div class="n">Sin técnico asignado</div><div class="p">Falta asignar</div></div></div>';
    dias.forEach(k=>{const l=sinTec.filter(f=>datosDia(f,k)),v=l.length>MAXC?l.slice(0,MAXC-1):l;h+='<div class="celda'+(k===hoy?' hoy':'')+'">'+v.map(f=>tarjeta(f,k)).join('')+(l.length>v.length?'<span class="mas">+'+(l.length-v.length)+'</span>':'')+'</div>';});}
  const filas=tecs.length+(sinTec.length?1:0);ajustar(filas);
  const g=document.getElementById('grid');g.style.gridTemplateRows='var(--hd) repeat('+filas+',minmax(0,1fr))';g.innerHTML=h;
}
// Ajuste a la pantalla: todas las filas caben sin desplazarse; letra y detalle según el alto disponible.
let MAXC=3,ULT=0;
function ajustar(filas){
  ULT=filas;const c=document.getElementById('cal'),H=c.clientHeight,W=c.clientWidth;
  const hd=Math.max(26,Math.min(44,H*.04)),fila=(H-hd)/Math.max(1,filas);
  const fs=Math.max(8,Math.min(15,fila*.42)),r=document.documentElement.style;
  r.setProperty('--hd',hd+'px');r.setProperty('--fs',fs+'px');
  r.setProperty('--verDet',fila>=fs*2.7?'block':'none');r.setProperty('--verPuesto',fila>=fs*2.7?'block':'none');
  r.setProperty('--colTec',Math.round(Math.max(150,Math.min(240,W*.13)))+'px');
  const anchoDia=(W-Math.max(150,Math.min(240,W*.13)))/7;MAXC=Math.max(2,Math.min(4,Math.floor(anchoDia/(fs*6))));
}
window.addEventListener('resize',()=>{if(previo)pintar(previo,lunes());});
setInterval(()=>{document.getElementById('reloj').textContent=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});},1000);
AUXC.clear();cargarFijos().then(cargar);setInterval(cargar,20000);setInterval(()=>cargarFijos(),300000);
</script>
